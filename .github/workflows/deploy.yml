name: Deploy to Ionos

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via SFTP to Ionos
        run: |
          lftp -c "
            set sftp:auto-confirm yes
            set net:max-retries 3
            open sftp://${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}@${{ secrets.FTP_SERVER }}
            mirror --reverse --delete --parallel=4 \
              --exclude-glob=.git \
              --exclude-glob=.github \
              --exclude-glob=.claude \
              --exclude-glob=.DS_Store \
              --exclude=CLAUDE.md \
              --exclude=.nojekyll \
              . /
            quit
          "
